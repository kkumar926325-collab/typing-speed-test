<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
    background:
        radial-gradient(circle at 20% 20%,#302b63 0%,transparent 35%),
        radial-gradient(circle at 80% 80%,#24243e 0%,transparent 40%),
        linear-gradient(135deg,#090014,#11152b,#050510);
}

.container{
    width:100%;
    max-width:760px;
    padding:30px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
    box-shadow:
        0 0 40px rgba(120,80,255,.18),
        0 20px 60px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    font-size:32px;
    margin-bottom:7px;
    background:linear-gradient(90deg,#00eaff,#9d5cff);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

#text{
    padding:22px;
    border-radius:16px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
    line-height:1.8;
    font-size:18px;
    margin-bottom:18px;
    color:#eee;
}

textarea{
    width:100%;
    height:140px;
    padding:17px;
    border-radius:16px;
    border:1px solid rgba(0,234,255,.25);
    background:rgba(0,0,0,.4);
    color:white;
    font-size:17px;
    outline:none;
    resize:none;
}

textarea:focus{
    border-color:#00eaff;
    box-shadow:0 0 18px rgba(0,234,255,.15);
}

textarea::placeholder{
    color:#777;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:22px 0;
}

.stat{
    padding:15px 5px;
    border-radius:15px;
    text-align:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.stat small{
    color:#aaa;
}

.stat span{
    display:block;
    font-size:27px;
    font-weight:bold;
    margin-top:6px;
    color:#00eaff;
}

.buttons{
    text-align:center;
}

button{
    padding:13px 25px;
    border:0;
    border-radius:13px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#00bfff,#7b4dff);
    box-shadow:0 5px 20px rgba(80,100,255,.25);
}

button:active{
    transform:scale(.96);
}

#result{
    display:none;
    margin-top:22px;
    padding:22px;
    border-radius:17px;
    text-align:center;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.1);
}

#result h2{
    color:#00eaff;
    margin-bottom:12px;
}

.result-score{
    font-size:20px;
    margin:7px;
}

.best{
    color:#aaa;
    margin-top:12px;
}

@media(max-width:550px){

    .container{
        padding:20px;
    }

    h1{
        font-size:27px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    #text{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>⌨️ Typing Speed Test</h1>

<p class="subtitle">
Test your typing speed like a pro
</p>

<div id="text"></div>

<textarea
id="input"
placeholder="Start typing here..."
></textarea>

<div class="stats">

<div class="stat">
<small>WPM</small>
<span id="wpm">0</span>
</div>

<div class="stat">
<small>Accuracy</small>
<span id="accuracy">100%</span>
</div>

<div class="stat">
<small>Time</small>
<span id="time">30s</span>
</div>

<div class="stat">
<small>Best</small>
<span id="best">0</span>
</div>

</div>

<div class="buttons">
<button onclick="restartTest()">
🔄 New Test
</button>
</div>

<div id="result">

<h2>🎉 Test Complete!</h2>

<div class="result-score">
Speed: <b id="finalWpm">0</b> WPM
</div>

<div class="result-score">
Accuracy: <b id="finalAccuracy">0%</b>
</div>

<p class="best">
Keep practicing and beat your best score 🚀
</p>

</div>

</div>

<script>

const passages = [

"The quick brown fox jumps over the lazy dog.",

"Practice makes a person perfect and typing becomes easier with regular practice.",

"Technology is changing the world and learning new skills can create amazing opportunities.",

"Success comes from consistent practice patience and never giving up."

];

const input = document.getElementById("input");

let text = "";
let startTime = null;
let timer = null;
let timeLeft = 30;
let finished = false;

function newPassage(){

    text =
        passages[
            Math.floor(Math.random() * passages.length)
        ];

    document.getElementById("text").innerText = text;
}

function startTimer(){

    if(timer) return;

    startTime = new Date();

    timer = setInterval(function(){

        timeLeft--;

        document.getElementById("time").innerText =
            timeLeft + "s";

        calculateStats();

        if(timeLeft <= 0){

            finishTest();

        }

    },1000);
}

input.addEventListener("input",function(){

    if(finished) return;

    if(!startTime){

        startTimer();

    }

    calculateStats();

    if(input.value.length >= text.length){

        finishTest();

    }

});

function calculateStats(){

    const typed = input.value;

    if(!typed){

        document.getElementById("wpm").innerText = "0";

        document.getElementById("accuracy").innerText =
            "100%";

        return;
    }

    const elapsed =
        Math.max(
            1,
            (new Date() - startTime) / 1000
        );

    const words =
        typed.trim().split(/\s+/).length;

    const minutes =
        elapsed / 60;

    const wpm =
        Math.round(words / minutes);

    let correct = 0;

    for(
        let i = 0;
        i < typed.length;
        i++
    ){

        if(typed[i] === text[i]){

            correct++;

        }

    }

    const accuracy =
        Math.round(
            (correct / typed.length) * 100
        );

    document.getElementById("wpm").innerText =
        wpm;

    document.getElementById("accuracy").innerText =
        accuracy + "%";
}

function finishTest(){

    if(finished) return;

    finished = true;

    clearInterval(timer);

    calculateStats();

    const finalWpm =
        document.getElementById("wpm").innerText;

    const finalAccuracy =
        document.getElementById("accuracy").innerText;

    document.getElementById("finalWpm").innerText =
        finalWpm;

    document.getElementById("finalAccuracy").innerText =
        finalAccuracy;

    document.getElementById("result").style.display =
        "block";

    const current =
        parseInt(finalWpm) || 0;

    const old =
        parseInt(
            localStorage.getItem("bestWpm")
        ) || 0;

    if(current > old){

        localStorage.setItem(
            "bestWpm",
            current
        );

        document.getElementById("best").innerText =
            current;
    }
}

function restartTest(){

    clearInterval(timer);

    timer = null;
    startTime = null;
    timeLeft = 30;
    finished = false;

    input.value = "";

    document.getElementById("wpm").innerText =
        "0";

    document.getElementById("accuracy").innerText =
        "100%";

    document.getElementById("time").innerText =
        "30s";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("best").innerText =
        localStorage.getItem("bestWpm") || "0";

    newPassage();

    input.focus();
}

document.getElementById("best").innerText =
    localStorage.getItem("bestWpm") || "0";

newPassage();

</script>

</body>
</html>
